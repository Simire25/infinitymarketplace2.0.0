<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#102b3f">
  <title>Admin | Infinity MarketPlace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="admin.css">
  <script src="../js/theme.js"></script>
  <script src="admin.js" defer></script>
</head>
<body class="admin-body">

  <!-- Sign-in gate: shown until an administrator or staff member signs in -->
  <section id="loginGate" class="login-gate" hidden>
    <form id="adminLoginForm" class="login-card">
      <span class="brand-mark" aria-hidden="true">∞</span>
      <h1>Infinity MarketPlace</h1>
      <p class="muted">Sign in to the admin console</p>
      <p class="form-error" id="gateError" hidden></p>
      <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="username"></label>
      <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn-dark btn-block" type="submit">Sign in</button>
      <div class="gate-theme" data-theme-slot></div>
    </form>
  </section>

  <div id="appShell" class="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand brand-light" href="../index.html">
        <span class="brand-mark" aria-hidden="true">∞</span>
        <span class="brand-name">Infinity<span>MarketPlace</span></span>
      </a>
      <p class="sidebar-label">ADMIN</p>
      <nav id="sideNav" class="side-nav" aria-label="Admin sections"></nav>
      <div class="sidebar-foot">
        <span id="whoami" class="muted"></span>
        <button id="logoutBtn" class="link-button" type="button">Log out</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="admin-topbar">
        <h1 id="viewTitle">Dashboard Overview</h1>
        <div class="topbar-right">
          <span id="clock" class="muted"></span>
          <span data-theme-slot></span>
        </div>
      </header>
      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>

# Render Blueprint: creates the web service and its persistent disk.
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: infinity-marketplace
    runtime: python
    plan: starter            # persistent disks need a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT "backend.app:create_app()"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false          # enter your Paystack secret key in the dashboard
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/marketplace.db
    disk:
      name: marketplace-data
      mountPath: /var/data
      sizeGB: 1
